# .github\workflows\docker-build.yml

name: Docker Build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "packages.txt"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false - so valida que a imagem builda (dbt Core + dbt
      # Fusion + dependencias do Airflow instalam sem erro). Nao publica
      # em nenhum registry.
      - name: Build image (validacao, sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: airflow-dbt-study:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
