# .yamllint
# Configuracao propositalmente permissiva: schema.yml do dbt costuma ter
# descriptions longas em uma linha so, e airflow_settings.yaml.example
# usa blocos com estilos variados.
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  comments:
    min-spaces-from-content: 1
