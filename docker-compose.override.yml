
services:
  postgres-warehouse:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
    networks:
      - airflow

  marquez-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    networks:
      - airflow

  # API marquez
  marquez:
    image: marquezproject/marquez:latest
    restart: unless-stopped
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5000:5000"   # API - é para onde o provider OpenLineage do Airflow envia eventos
      - "5001:5001"   # admin/health
    networks:
      - airflow

  #  UI web do Marquez
  marquez-web:
    image: marquezproject/marquez-web:latest
    restart: unless-stopped
    depends_on:
      - marquez
    environment:
      WEB_PORT: 3000
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
    ports:
      - "3000:3000"
    networks:
      - airflow

volumes:
  postgres_warehouse_data:
  marquez_db_data:

networks:
  airflow:
    name: airflow-dbt-study_f4057d_airflow
    # external: true