services:
  postgres-warehouse:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass12345}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_WAREHOUSE_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
    networks:
      - airflow

  marquez-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MARQUEZ_DB_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
      POSTGRES_DB: ${MARQUEZ_DB_NAME:-marquez}
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${MARQUEZ_DB_USER:-marquez} -d ${MARQUEZ_DB_NAME:-marquez}"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    networks:
      - airflow

  # API marquez
  marquez:
    image: marquezproject/marquez:latest
    restart: unless-stopped
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${MARQUEZ_DB_NAME:-marquez}
      POSTGRES_USER: ${MARQUEZ_DB_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
    ports:
      - "${MARQUEZ_API_PORT:-5000}:5000"
      - "${MARQUEZ_ADMIN_PORT:-5001}:5001"
    networks:
      - airflow

  #  UI web do Marquez
  marquez-web:
    image: marquezproject/marquez-web:latest
    restart: unless-stopped
    depends_on:
      - marquez
    environment:
      WEB_PORT: 3000
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
    ports:
      - "${MARQUEZ_WEB_PORT:-3000}:3000"
    networks:
      - airflow

volumes:
  postgres_warehouse_data:
  marquez_db_data:

networks:
  airflow:
    name: airflow-dbt-study_f4057d_airflow
